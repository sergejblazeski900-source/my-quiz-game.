<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Master Ultimate</title>
<style>
:root{--bg:#10172a;--panel:#202c48;--blue:#4267d5;--cyan:#65d6ff;--green:#159b68;--red:#c43d50}
*{box-sizing:border-box}
body{margin:0;padding:22px 14px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#10172a,#253b70);color:white;text-align:center}
.wrap{max-width:900px;margin:auto}
.game{background:var(--panel);max-width:780px;margin:18px auto;padding:24px;border-radius:18px;box-shadow:0 18px 50px #0005}
h1{color:var(--cyan);margin:5px}
button{font:inherit;display:block;width:100%;padding:13px;margin:9px 0;border:0;border-radius:9px;background:var(--blue);color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.5;cursor:default}
.secondary{background:#354568}
.green{background:var(--green)}
.hidden{display:none!important}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.row button{margin:0}
.stat{background:#17233d;padding:12px;border-radius:10px}
.muted,small{color:#bdc9e4}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.levelgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:7px;max-height:390px;overflow:auto;padding:4px}
.levelgrid button{padding:10px 3px;font-size:13px;margin:0}
.done{background:#137c5a}
.locked{background:#354056}
.answer{background:#354568;text-align:left}
.answer.correct{background:#159b68}
.answer.wrong{background:#c43d50}
.progress{height:8px;background:#121d35;border-radius:20px;overflow:hidden;margin:12px 0}
.progress span{display:block;height:100%;background:var(--cyan);width:0}
#feedback{min-height:25px;font-weight:bold}
#question{line-height:1.4}
.category{display:inline-block;background:#354568;padding:7px 12px;border-radius:20px;color:var(--cyan);font-size:13px}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
<h1>🧠 QUIZ MASTER ULTIMATE</h1>
<span class="muted">500 нивоа · 7.500 прашања по играње</span>
</div>

<section id="home" class="game">
<h2>Избери ниво</h2>
<p class="muted">Секое ниво има 15 прашања. Потребни се најмалку 12 точни одговори за да го отклучиш следното ниво.</p>
<div class="row">
<div class="stat">⭐ Поени: <b id="points">0</b></div>
<div class="stat">🏆 Завршени нивоа: <b id="completed">0</b></div>
</div>
<div id="levelgrid" class="levelgrid" style="margin-top:16px"></div>
<button class="secondary" onclick="resetProgress()">Ресетирај напредок</button>
</section>

<section id="quiz" class="game hidden">
<div class="top">
<b id="levelname">Ниво 1</b>
<span id="counter">Прашање 1/15</span>
</div>
<div class="progress"><span id="bar"></span></div>
<span class="category" id="category"></span>
<h2 id="question"></h2>
<div id="answers"></div>
<p id="feedback"></p>
<p id="score">Точни одговори: 0</p>
<button id="next" class="green" onclick="nextQuestion()" disabled>Следно прашање</button>
<button class="secondary" onclick="backHome()">Излез кон мени</button>
</section>

<section id="result" class="game hidden">
<h2 id="resulttitle">Резултат</h2>
<h1 id="resultscore"></h1>
<p id="resulttext" class="muted"></p>
<button onclick="backHome()">Назад кон нивоата</button>
</section>

</div>
