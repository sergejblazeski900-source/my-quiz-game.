<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Master</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#10172e,#263b70);color:white;min-height:100vh;padding:18px}
.container{max-width:800px;margin:20px auto;background:#192544;padding:25px;border-radius:22px;box-shadow:0 10px 35px #0006}
h1{text-align:center;color:#ffd45c;font-size:34px}
h2{text-align:center}
p{text-align:center;color:#d5def5}
button,input,select{font-size:17px;border:0;border-radius:12px;padding:14px;margin:6px}
button{background:#ffc94d;color:#17213c;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.45;cursor:not-allowed}
.menu button{display:block;width:100%;margin:12px 0}
.option{display:block;width:100%;background:#30466f;color:white;text-align:left}
.option.correct{background:#168b59}
.option.wrong{background:#b33d50}
#screen{min-height:300px}
.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#101a33;padding:12px;border-radius:12px}
.timer{height:12px;background:#405276;border-radius:10px;overflow:hidden;margin:15px 0}
#timerBar{height:100%;background:#ffc94d;width:100%;transition:width .2s}
.small{font-size:13px;color:#b8c7e8}
.hidden{display:none}
input{width:90%;max-width:350px}
</style>
</head>
<body>
<div class="container">
<h1>🏆 QUIZ MASTER</h1>
<div id="screen"></div>
</div>

<script>
const $ = id => document.getElementById(id.replace(/^#/, ""));
let level = 1, points = 0, questionIndex = 0, questions = [];
let timeLeft = 25, timer = null, locked = false;
let tournament = false, totalQuestions = 15;
let players = [], playerScores = [0,0], currentPlayer = 0;
let tournamentQuestions = [], tournamentIndex = 0;

try {
 const saved = JSON.parse(localStorage.getItem("quizMasterSave") || "{}");
 level = Math.max(1,Math.min(500,Number(saved.level)||1));
 points = Math.max(0,Number(saved.points)||0);
} catch(e) {}

function save(){
 localStorage.setItem("quizMasterSave",JSON.stringify({level,points}));
}

function tier(l){
 if(l<100)return 1;
 if(l<200)return 2;
 if(l<300)return 3;
 if(l<400)return 4;
 return 5;
}

function rand(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rand(a.length)]}
function makeQ(category,question,answer,wrong){
 let choices=[answer,...wrong];
 choices=[...new Set(choices.map(String))];
 while(choices.length<4) choices.push("Одговор "+(choices.length+1));
 choices=choices.slice(0,4).sort(()=>Math.random()-.5);
 return {category,question,answer:String(answer),choices};
}

const countries=[
 ["Франција","Париз"],["Италија","Рим"],["Германија","Берлин"],
 ["Шпанија","Мадрид"],["Грција","Атина"],["Јапонија","Токио"],
 ["Австралија","Канбера"],["Канада","Отава"],["Египет","Каиро"],
 ["Бразил","Бразилија"],["Србија","Белград"],["Албанија","Тирана"],
 ["Бугарија","Софија"],["Хрватска","Загреб"],["Португалија","Лисабон"]
];
const sports=[
 ["Колку играчи има еден фудбалски тим на терен?","11",["9","10","12"]],
 ["Во кој спорт се користи кош?","Кошарка",["Тенис","Ракомет","Одбојка"]],
 ["Колку прстени има олимпискиот симбол?","5",["4","6","7"]],
 ["Кој спорт се игра со рекет и топче?","Тенис",["Фудбал","Пливање","Бокс"]],
 ["Колку поени вреди слободно фрлање во кошарка?","1",["2","3","4"]],
 ["Кој спорт има позиција голман?","Фудбал",["Тенис","Атлетика","Бокс"]]
];
const science=[
 ["Која планета е позната како Црвената планета?","Марс",["Венера","Јупитер","Сатурн"]],
 ["Кој гас го вдишуваат луѓето за да живеат?","Кислород",["Азот","Водород","Јаглерод диоксид"]],
 ["Колку нозе има пајакот?","8",["6","10","12"]],
 ["Која е хемиската формула на водата?","H2O",["CO2","O2","NaCl"]],
 ["Која ѕвезда е најблиску до Земјата?","Сонцето",["Сириус","Поларна","Вега"]],
 ["Кој орган пумпа крв низ телото?","Срцето",["Белите дробови","Црниот дроб","Бубрезите"]]
];
const history=[
 ["Во која година започнала Втората светска војна?","1939",["1914","1941","1945"]],
 ["Кој бил првиот човек на Месечината?","Нил Армстронг",["Јуриј Гагарин","Баз Олдрин","Алан Шепард"]],
 ["Која древна цивилизација ги изградила пирамидите во Гиза?","Египетската",["Римската","Грчката","Персиската"]],
 ["Во која година завршила Втората светска војна?","1945",["1939","1941","1950"]],
 ["Кој бил познат македонски револуционер?","Гоце Делчев",["Никола Тесла","Марко Поло","Леонардо да Винчи"]]
];
const culture=[
 ["Кој ја напишал драмата „Хамлет“?","Вилијам Шекспир",["Чарлс Дикенс","Толстој","Достоевски"]],
 ["Кој инструмент има црни и бели клавиши?","Пијано",["Гитара","Труба","Виолина"]],
 ["Во кој град се наоѓа Лувр?","Париз",["Лондон","Рим","Берлин"]],
 ["Која уметност користи бои и платно?","Сликарство",["Вајање","Театар","Архитектура"]]
];
const macedonian=[
 ["Кој збор е именка?","Книга",["Убаво","Трча","Брзо"]],
 ["Кој збор е глагол?","Пишува",["Маса","Син","Убав"]],
 ["Која е множина од зборот „човек“?","Луѓе",["Човека","Човекови","Човеци"]],
 ["Кој знак се става на крај на прашална реченица?","?",[".","!",","]]
];
const english=[
 ["Што значи зборот „apple“?","Јаболко",["Круша","Портокал","Праска"]],
 ["Кој е минатиот облик на „go“?","Went",["Goed","Gone","Going"]],
 ["Што значи „beautiful“?","Убав",["Брз","Голем","Силен"]],
 ["Кој збор е спротивен на „hot“?","Cold",["Warm","Fast","Tall"]]
];

function makeQuestion(l){
 let t=tier(l), c=rand(8);
 if(c===0){
  let a=rand(10*t+10)+1,b=rand(10*t+10)+1;
  let op=rand(2)===0?"+":"×";
  let ans=op==="+"?a+b:a*b;
  return makeQ("Математика",`${a} ${op} ${b} = ?`,ans,[ans+1,ans-1,ans+3]);
 }
 if(c===1){
  let item=pick(countries);
  return makeQ("Географија",`Кој е главен град на ${item[0]}?`,item[1],countries.filter(x=>x[1]!==item[1]).slice(0,3).map(x=>x[1]));
 }
 if(c===2){let x=pick(sports);return makeQ("Спорт",x[0],x[1],x[2]);}
 if(c===3){let x=pick(science);return makeQ("Наука",x[0],x[1],x[2]);}
 if(c===4){let x=pick(macedonian);return makeQ("Македонски јазик",x[0],x[1],x[2]);}
 if(c===5){let x=pick(english);return makeQ("Англиски јазик",x[0],x[1],x[2]);}
 if(c===6){let x=pick(history);return makeQ("Историја",x[0],x[1],x[2]);}
 let x=pick(culture);return makeQ("Култура",x[0],x[1],x[2]);
}

function showHome(){
 clearInterval(timer);
 $("screen").innerHTML=`
 <div class="stats"><span>⭐ Поени: ${points}</span><span>🔓 Ниво: ${level}/500</span></div>
 <div class="menu">
 <button onclick="startLevel()">🎮 ИГРАЈ НИВО ${level}</button>
 <button onclick="showLevels()">📚 ИЗБЕРИ НИВО</button>
 <button onclick="showTournamentSetup()">🏆 ТУРНИР 1 НА 1</button>
 </div>
 <p class="small">8 категории • 4 одговори • 25 секунди по прашање</p>`;
}

function startLevel(){
 tournament=false;
 totalQuestions=15;
 questions=Array.from({length:15},()=>makeQuestion(level));
 questionIndex=0;
 startQuestion();
}

function showLevels(){
  clearInterval(timer);
  let html = `<h2>Избери ниво</h2>
  <p>Отклучено до ниво ${level}</p>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;">`;

  for(let i=1;i<=500;i++){
    html += `<button
      ${i>level ? "disabled" : ""}
      onclick="level=${i};startLevel()"
      style="padding:12px;margin:3px;">
      ${i}
    </button>`;
  }

  html += `</div>
  <button onclick="showHome()">Назад</button>`;

  $("#screen").innerHTML=html;
}

window.startLevel = startLevel;
window.showLevels = showLevels;
window.showHome = showHome;


showHome();
</script>
